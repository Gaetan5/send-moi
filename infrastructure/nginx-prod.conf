# ==============================================================================
#           SEND MOI — CONFIGURATION NGINX PRODUCTION (HTTPS / SSL)
# ==============================================================================

# 1. Redirection HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name sendmoi.cm www.sendmoi.cm api.sendmoi.cm;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Site Vitrine & Landing Page (https://sendmoi.cm)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sendmoi.cm www.sendmoi.cm;

    ssl_certificate /etc/letsencrypt/live/sendmoi.cm/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sendmoi.cm/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# 3. Backend API REST & WebSockets (https://api.sendmoi.cm)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.sendmoi.cm;

    ssl_certificate /etc/letsencrypt/live/sendmoi.cm/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sendmoi.cm/privkey.pem;

    # API REST Proxy
    location / {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSockets Proxy (Socket.IO)
    location /socket.io/ {
        proxy_pass http://backend:3000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }
}
