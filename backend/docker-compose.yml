version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: send_moi_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-send_moi_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-send_moi_password}
      POSTGRES_DB: ${POSTGRES_DB:-send_moi_db}
    ports:
      - '54322:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: send_moi_redis
    restart: always
    ports:
      - '63792:6379'
    volumes:
      - redis_data:/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: send_moi_api
    restart: always
    ports:
      - '3000:3000'
    environment:
      PORT: 3000
      NODE_ENV: ${NODE_ENV:-development}
      DEV_MASTER_OTP: ${DEV_MASTER_OTP:-123456}
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-send_moi_user}:${POSTGRES_PASSWORD:-send_moi_password}@postgres:5432/${POSTGRES_DB:-send_moi_db}?schema=public}
      JWT_SECRET: ${JWT_SECRET:-send_moi_dev_secret_key_2026}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
  redis_data:
