name: send_moi_app
description: "Application mobile multi-rôles Send Moi (Client & Agent indépendant avec mode offline-first)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.9
  go_router: ^13.1.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  http: ^1.2.0
  intl: ^0.19.0
  geolocator: ^10.1.0
  camera: ^0.10.5+9
  socket_io_client: ^2.0.3+1
  flutter_secure_storage: ^9.0.0
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
