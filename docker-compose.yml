version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: send_moi_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-send_moi_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-send_moi_password}
      POSTGRES_DB: ${POSTGRES_DB:-send_moi_db}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: send_moi_redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: send_moi_api
    restart: always
    ports:
      - '3000:3000'
    environment:
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-send_moi_user}:${POSTGRES_PASSWORD:-send_moi_password}@postgres:5432/${POSTGRES_DB:-send_moi_db}?schema=public}
      JWT_SECRET: ${JWT_SECRET:-send_moi_dev_secret_key_2026}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - postgres
      - redis

  web:
    image: nginx:alpine
    container_name: send_moi_web
    restart: always
    ports:
      - '80:80'
    volumes:
      - ./landing:/usr/share/nginx/html:ro
      - ./infrastructure/nginx-local.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
